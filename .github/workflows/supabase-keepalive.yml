name: Supabase Keep-Alive Ping

# Runs every 3 days at 6:00 AM IST (00:30 UTC)
on:
  schedule:
    - cron: "30 0 */3 * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep project active
        run: |
          echo "Pinging Supabase project MgWellRings..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://sedebhmfreuasjnnsjzn.supabase.co/rest/v1/materials?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlZGViaG1mcmV1YXNqbm5zanpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNDE4NDgsImV4cCI6MjA5ODcxNzg0OH0.jtNLYqa4objmzxhRoeq3iAYmkChp29n83I6tWDt5prI" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNlZGViaG1mcmV1YXNqbm5zanpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMxNDE4NDgsImV4cCI6MjA5ODcxNzg0OH0.jtNLYqa4objmzxhRoeq3iAYmkChp29n83I6tWDt5prI")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 206 ]; then
            echo "✅ Supabase project is active and responding."
          else
            echo "⚠️  Unexpected status code: $STATUS"
            exit 1
          fi
