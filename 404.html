<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="robots" content="noindex, follow">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    .not-found-wrapper {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 40px 20px;

      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--text-main);

    .not-found-desc {
      font-size: 1rem;
      color: var(--text-muted);

      margin-bottom: 24px;
      line-height: 1.5;
    }

<body>
  <div class="not-found-wrapper">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Page Not Found</h1>
